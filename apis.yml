aid: zywave
name: Zywave
description: Zywave is an insurance technology company providing agency management, sales, content, benefits and
  client-engagement software for insurance agencies, brokers and carriers. It publishes a REST API (v2.x and v3.x
  resources documented at zywave.dev, OpenAPI per resource on api.zywave.com) and a remote MCP server. TurboRater
  (all/turborater) is a Zywave Sales Cloud product profiled separately.
