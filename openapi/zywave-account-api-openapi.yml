      description: ''
      x-enumNames:
      - Personal
      - Commercial
      enum:
      - Personal
      - Commercial
    AccountRelationship:
      type: string
      description: ''
      x-enumNames:
      - BenefitProspect
      - BenefitClient
      - PcProspect
      - PcClient
      enum:
      - BenefitProspect
      - BenefitClient
      - PcProspect
      - PcClient
