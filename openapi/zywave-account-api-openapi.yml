      type: object
      additionalProperties: false
      required:
      - name
      properties:
        isArchived:
          type: boolean
          description: Indicates whether the account is archived.
          default: false
        name:
          type: string
          description: The name of the account.
          maxLength: 255
          minLength: 1
        addressLine1:
          type:
          - string
          - 'null'
          description: Line 1 of the primary address for the account.
          maxLength: 255
        addressLine2:
          type:
          - string
          - 'null'
          description: Line 2 of the primary address for the account.
          maxLength: 255
        addressLine3:
          type:
          - string
          - 'null'
          description: Line 3 of the primary address for the account.
          maxLength: 100
        city:
          type:
          - string
          - 'null'
          description: The city of the primary address for the account.
          maxLength: 75
        county:
          type:
          - string
          - 'null'
          description: The county of the primary address for the account.
          maxLength: 150
        state:
          type:
          - string
          - 'null'
          description: The state of the primary address for the account.
          maxLength: 4
        country:
          type:
          - string
          - 'null'
          description: The country of the primary address for the account.
          maxLength: 2
        postalCode:
          type:
          - string
          - 'null'
          description: The zip code or postal code of the primary address for the account.
          maxLength: 50
        phoneNumber:
          type:
          - string
          - 'null'
          description: The phone number for a business account.
          maxLength: 50
        faxNumber:
          type:
          - string
          - 'null'
          description: The fax number for the account.
          maxLength: 50
