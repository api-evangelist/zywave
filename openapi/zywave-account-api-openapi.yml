  /accounts/v2.0/account/matches:
    get:
      tags:
      - Account
      summary: Finds existing accounts using specified criteria and our standard matching…
      description: 'The Zywave API duplicate search is implemented using OData Version 4.0.1. Not all OData operations are available for the Zywave API platform at this time. Not all properties are filterable or sortable.

        The following properties can be used when filtering and ordering the response. At least one criteria marked with double asterisks is required

        * msid (miEdge system ID) **

        * name **

        * addressLine1 **

        * addressLine2

        * state

        * postalCode

        * phoneNumber **

        * classification

        * updatedDateTime

        * industryId


        See the Zywave API search documentation for more details about using OData search.'
