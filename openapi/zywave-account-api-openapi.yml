      - From0To25
      - From26To50
      - From51To99
      - From100To499
      - From500To999
      - From1000To2499
      - From2500To4999
      - MoreThan4999
      enum:
      - From0To25
      - From26To50
      - From51To99
      - From100To499
      - From500To999
      - From1000To2499
      - From2500To4999
      - MoreThan4999
