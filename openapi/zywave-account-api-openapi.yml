            format: int32
          createdDateTime:
            type: string
            description: The date in which the account was created.
            format: date-time
          updatedDateTime:
            type: string
            description: The date in which the account was last updated.
            format: date-time
          msid:
            type:
            - string
            - 'null'
            description: The MiEdge MSID for this account.
