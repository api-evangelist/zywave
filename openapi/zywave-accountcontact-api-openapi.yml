  /accounts/v2.0/accountcontact:
    get:
      tags:
      - AccountContact
      summary: Search for account contacts
      description: 'The Zywave API search is implemented using OData Version 4.0.1. Not all OData operations are available for the Zywave API platform at this time. Not all properties are filterable or sortable.

        The following properties that can be used when filtering and ordering the response.

        * id

        * accountId

        * firstName

        * lastName

        * isPrimaryContact

        * isActive


        The following OData filter operations are supported by the Zywave API; each is accompanied by an example request.


        | Operation | Example Request | Returns |

        | ------- | -------- | -------- |

        | endswith | endswith(lastName,''tact'') | Returns all account contacts where the last name ends with ''tact'' |

        | startswith | startswith(lastName,''Cont'') | Returns all account contacts where the last name starts with ''Cont'' |

        | contains | contains(lastName,''tact'') | Returns all account contacts where the name contains ''tact'' |

        | Equals | accountId eq 2726742 | Returns all account contacts for the Zywave account with this unique id |

        | Not Equals | isActive ne false | Returns all account contacts that are active |

        | In | lastName in (''Cont'', ''act'') | Returns all account contacts where the last name is ''Cont'' or ''act'' |

        | Not | not startswith(lastName, ''Cont'') | Returns all account contacts where the last name does not start with ''Cont'' |


        The Zywave API also supports the And operation which will allow for multiple search criteria to be applied to a single request. For example, the following filter will return all active account contacts for the given account;


        *accountId eq 726742 and isActive ne false*


        The orderby operation also supports multiple levels of ordering. For example, to order the results by accountId then lastName the following can be used;


        *accountId asc, lastName asc*'
      operationId: AccountContact_SearchContacts
      parameters:
      - name: $filter
        x-originalName: filter
        in: query
        description: The search criteria for the request. To view a list of supported search operations and the properties which can be searched see the documentation above.
        schema:
          type:
          - string
          - 'null'
        x-position: 1
      - name: $orderBy
        x-originalName: orderBy
        in: query
        description: Defines the order in which the results are returned. To view a list of properties that can be used in ordering see the documentation above.
        schema:
          type:
          - string
          - 'null'
        x-position: 2
      - name: $skip
        x-originalName: skip
        in: query
        description: The number of total records to skip before displaying the first result. For example, if there are 10 total records and $skip is set to 5 the first record shown in the response will be the 6th record returned. In order to avoid an error please ensure that the $skip is dividable by the $top.
        schema:
          type:
          - integer
          - 'null'
          format: int32
        x-position: 3
      - name: $top
        x-originalName: top
        in: query
        description: The total number of records returned in the response. In order to avoid an error please ensure that the $skip is dividable by the $top.
        schema:
          type:
          - integer
          - 'null'
          format: int32
        x-position: 4
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedResultOfAccountContact'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '401':
