          format: int32
        addressLine1:
          type:
          - string
          - 'null'
          maxLength: 255
        addressLine2:
          type:
          - string
          - 'null'
          maxLength: 255
        addressLine3:
          type:
          - string
          - 'null'
          maxLength: 100
        city:
          type:
          - string
          - 'null'
          maxLength: 75
        country:
          type:
          - string
          - 'null'
          maxLength: 2
        county:
          type:
          - string
          - 'null'
          maxLength: 150
        isPrimary:
          type: boolean
        postalCode:
          type:
          - string
          - 'null'
          maxLength: 50
        state:
          type:
          - string
          - 'null'
          maxLength: 4
        type:
          $ref: '#/components/schemas/AddressType'
    Address:
      allOf:
      - $ref: '#/components/schemas/AddressInfo'
      - type: object
        additionalProperties: false
        properties:
          id:
            type: integer
            format: int32
    Phone:
      allOf:
      - $ref: '#/components/schemas/PhoneInfo'
      - type: object
        additionalProperties: false
        properties:
          id:
            type: integer
            format: int32
    AccountContactInfo:
      type: object
      additionalProperties: false
      properties:
        accountId:
          type: integer
          description: The unique Zywave identifier for the account the contact is associated with.
          format: int32
        addressLine1:
          type:
          - string
          - 'null'
          description: Line 1 of the primary address for the account contact.
          maxLength: 255
        addressLine2:
          type:
          - string
          - 'null'
          description: Line 2 of the primary address for the account contact.
          maxLength: 255
        addressLine3:
          type:
          - string
          - 'null'
          description: Line 3 of the primary address for the account contact.
          maxLength: 100
        birthDate:
          type:
          - string
          - 'null'
          description: The birth date of the account contact.
          format: date-time
        city:
          type:
          - string
          - 'null'
          description: The city of the primary address for the account contact.
          maxLength: 75
        contactConsentExpirationDateTime:
          type:
          - string
          - 'null'
          description: The expiration of consent, used primarily in regions where consent is required to send email to the contact.
          format: date-time
        contactConsentSource:
          type:
          - string
          - 'null'
          description: The source through which the contact consented to receive email, used primarily in regions where consent is required to send email to the contact.
          maxLength: 100
        country:
          type:
          - string
          - 'null'
          description: The country of the primary address for the account contact.
          maxLength: 2
        county:
          type:
          - string
          - 'null'
          description: The county of the primary address for the account contact.
          maxLength: 150
        emailAddress:
          type:
          - string
          - 'null'
          description: The email address for the account contact.
          maxLength: 100
        faxNumber:
          type:
          - string
          - 'null'
          description: The fax number for the account contact.
          maxLength: 50
        firstName:
          type:
          - string
          - 'null'
          description: The first name for the account contact.
          maxLength: 50
        isActive:
          type: boolean
          description: Specifies whether or not the account contact appears in Zywave applications not used to manage accounts and account contacts.
        isArchived:
          type: boolean
          description: Specifies whether an account has been deleted from view in Zywave applications including applications used to manage accounts and contacts.
        isEmailAllowed:
          type: boolean
          description: Specifies whether the account contact will receive email notifications related to distributions sent from zywave applications.
        isPrimaryContact:
          type: boolean
          description: Specifies whether or not the contact is a primary contact for the account. More than one primary contact can exist per account. Primary contacts will appear on the account information screen in applications used to manage accounts and contacts.
        lastName:
          type:
          - string
          - 'null'
          description: The last name for the account contact.
          maxLength: 50
        mobilePhoneNumber:
          type:
          - string
          - 'null'
          description: The mobile phone number for the account contact.
          maxLength: 50
        phoneNumber:
          type:
          - string
          - 'null'
          description: The phone number for the account contact.
          maxLength: 50
        phoneNumberExtension:
          type:
