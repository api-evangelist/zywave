      summary: Deletes the benefit item values associated with the policy
      operationId: BenefitItemValues_DeleteBenefitItemValues
      parameters:
      - name: policyId
        in: path
        required: true
        description: The ID of the policy for which all benefit value items are to be deleted.
        schema:
          type: integer
          format: int32
        x-position: 1
      responses:
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '204':
          description: A 204 No Content response.
      security:
      - oidc:
        - api.policiesFull
    get:
      tags:
      - BenefitItemValues
      summary: Returns list of benefit item values for the policy
      operationId: BenefitItemValues_SearchBenefitItemValuesFromPolicy
      parameters:
      - name: policyId
        in: path
        required: true
        description: The policy id.
        schema:
          type: integer
          format: int32
        x-position: 1
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BenefitItemValue'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - oidc:
        - api.policies:readFull
    post:
      tags:
      - BenefitItemValues
      summary: Creates a benefit item value
      description: Benefit item value has a dependency on other benefit item value items and caller should be able to handle discrepancies, race conditions, and object creation order. Please check model for more information on each dependency.
      operationId: BenefitItemValues_PostBenefitItemValueFromPolicy
      parameters:
      - name: policyId
        in: path
        required: true
        description: The policy id.
        schema:
          type: integer
          format: int32
        x-position: 1
      requestBody:
        x-name: benefitItemValueInfo
        description: The benefit item value to create.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BenefitItemValueBaseInfo'
        required: true
        x-position: 2
      responses:
        '201':
          description: A 201 Created response containing the ID of the created benefit item value.
          content:
            application/json:
              schema:
                type: integer
                format: int32
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
      security:
      - oidc:
        - api.policiesFull
  /policies/v2.0/policies/{policyId}/benefititemvalues/{id}:
    delete:
