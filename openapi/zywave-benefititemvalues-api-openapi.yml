components:
  schemas:
    ProblemDetails:
      type: object
      additionalProperties: {}
      properties:
        type:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
    BenefitItemValue:
      allOf:
      - $ref: '#/components/schemas/BenefitItemValueInfo'
      - type: object
        additionalProperties: false
        properties:
          id:
            type: integer
            description: The unique Zywave identifier for the benefit item value.
            format: int32
    BenefitItemValueType:
      type: string
      description: ''
      x-enumNames:
      - Percent
      - Dollar
      - DollarOrPercent
      - Boolean
      - Numeric
      - Options
      - Text
      enum:
      - Percent
      - Dollar
      - DollarOrPercent
      - Boolean
      - Numeric
      - Options
      - Text
    BenefitItemValueBaseInfo:
      type: object
      additionalProperties: false
      properties:
        benefitItemClauseId:
          type: integer
          format: int32
        sortOrder:
          type: integer
          format: int32
        text:
          type:
          - string
          - 'null'
          description: Additional information about the Benefit Item besides its main Value.
          maxLength: 255
        value:
          type:
          - string
          - 'null'
          description: Value of the Benefit Item. May contain text or number. Should contain integer valid OptionId if BenefitItemValueType is 'Options'
          maxLength: 255
        benefitItemValueType:
          $ref: '#/components/schemas/BenefitItemValueType'
    BenefitItemValueInfo:
      allOf:
      - $ref: '#/components/schemas/BenefitItemValueBaseInfo'
      - type: object
        additionalProperties: false
        properties:
          policyId:
            type: integer
            format: int32
    ValidationProblemDetails:
      allOf:
      - $ref: '#/components/schemas/HttpValidationProblemDetails'
      - type: object
        additionalProperties: {}
        properties:
          errors:
            type: object
            additionalProperties:
              type: array
              items:
                type: string
    HttpValidationProblemDetails:
      allOf:
      - $ref: '#/components/schemas/ProblemDetails'
      - type: object
        additionalProperties: {}
        properties:
          errors:
            type: object
            additionalProperties:
              type: array
              items:
                type: string
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://auth.zywave.com/.well-known/openid-configuration
