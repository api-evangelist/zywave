      type: object
      additionalProperties: false
      properties:
        searchCriteria:
          oneOf:
          - $ref: '#/components/schemas/CarrierCodeSearchCriteria'
        searchOptions:
          oneOf:
          - $ref: '#/components/schemas/SearchOptions'
    PagedResultOfCarrierCode:
      type: object
      additionalProperties: false
      properties:
        hasMoreResults:
          type: boolean
        pageIndex:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        skip:
          type: integer
          format: int32
        take:
          type: integer
          format: int32
        totalCount:
          type: integer
          format: int32
        items:
          type: array
          items:
            $ref: '#/components/schemas/CarrierCode'
    StringSearchType:
      type: string
      description: ''
      x-enumNames:
      - None
      - Equals
      - NotEquals
      - Contains
      - IsNullOrEmpty
      - StartsWith
      - EndsWith
      enum:
      - None
      - Equals
      - NotEquals
      - Contains
      - IsNullOrEmpty
      - StartsWith
      - EndsWith
