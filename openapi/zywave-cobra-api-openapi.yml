openapi: 3.2.0
info:
  title: Policies COBRA API
  version: v2.0
servers:
- url: https://api.zywave.com
security:
- oidc:
  - api.policies
  - api.policies:read
tags:
- name: COBRA
paths:
  /policies/v2.0/policies/{id}/cobra/{rateTier}:
    delete:
      tags:
      - COBRA
      summary: Deletes a COBRA record
      description: _Cobra Rate is influenced by Cobra Rate Strategy._
      operationId: Policies_DeleteCobraRate
      parameters:
      - name: id
        in: path
        required: true
        description: The policy id.
        schema:
          type: integer
          format: int32
        x-position: 1
      - name: rateTier
        in: path
        required: true
        description: The rate tier.
        schema:
          $ref: '#/components/schemas/RateTierTypeOption'
        x-position: 2
      responses:
        '204':
          description: A 204 NoContent response.
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - oidc:
        - api.policiesFull
  /policies/v2.0/policies/{id}/cobrastrategies:
    delete:
      tags:
      - COBRA
      summary: Deletes a COBRA strategy and child records
      operationId: Policies_DeleteCobraRateStrategy
      parameters:
      - name: id
        in: path
        required: true
        description: The policy id.
        schema:
          type: integer
          format: int32
        x-position: 1
      responses:
        '204':
          description: A 204 NoContent response.
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - oidc:
        - api.policiesFull
    put:
      tags:
      - COBRA
      summary: Inserts or updates a COBRA rate strategy
      description: 'Cobra Rate is influenced by Cobra Rate Strategy.


        **Note:** Changing `OverrideDefaultRate` from `false` to `true` will **OVERWRITE** the saved values.


        **Note:** Setting `DefaultRate` will change values in all records _UNLESS_ `OverrideDefaultRate` is `false`.'
      operationId: Policies_UpsertCobraStrategy
      parameters:
      - name: id
        in: path
        required: true
        description: The policy id.
        schema:
          type: integer
          format: int32
        x-position: 1
      requestBody:
        x-name: cobraStrategy
        description: The CobraRateStrategy.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CobraRateStrategyInfo'
        required: true
        x-position: 2
      responses:
        '201':
          description: A 200 OK result for an update or a 201 Created for an insert.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CobraRatesWithStrategy'
        '200':
          description: A 200 OK result for an update or a 201 Created for an insert.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CobraRatesWithStrategy'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - oidc:
        - api.policiesFull
  /policies/v2.0/policies/{id}/cobra:
    get:
      tags:
      - COBRA
      summary: Gets the COBRA rates for the policy
      description: _Cobra Rate is influenced by Cobra Rate Strategy._
      operationId: Policies_GetCobraRates
      parameters:
      - name: id
        in: path
        required: true
        description: The policy id.
        schema:
          type: integer
          format: int32
        x-position: 1
      responses:
        '200':
          description: A 200 OK response with the COBRA rate records and strategy for the policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CobraRatesWithStrategy'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - oidc:
        - api.policies:readFull
  /policies/v2.0/policies/{id}/cobra/{contributionTier}:
    put:
      tags:
      - COBRA
      summary: Inserts or updates a COBRA rate record
      description: 'Cobra Rate is influenced by Cobra Rate Strategy.


        **NOTE:** If the `CobraRateStrategy` associated with the policy has `OverrideDefaultRate` = `false`, the value will **NOT** be used. The record for the tier will be created, however, if it does not already exist.'
      operationId: Policies_UpsertCobraRate
      parameters:
      - name: id
        in: path
        required: true
        description: The policy id.
        schema:
          type: integer
          format: int32
        x-position: 1
      - name: contributionTier
        in: path
        required: true
        description: The contribution tier.
        schema:
          $ref: '#/components/schemas/RateTierTypeOption'
        x-position: 2
      requestBody:
        x-name: cobraRateInfo
        description: The CobraRateRecord.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CobraRateRecordInfo'
        required: true
        x-position: 3
      responses:
        '200':
          description: Either a 200 OK (for an update) or a 201 Created (for an insert) with a ContributionRecord payload containing the computed contributions in dollars for employer and employee.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CobraRateRecord'
        '201':
          description: Either a 200 OK (for an update) or a 201 Created (for an insert) with a ContributionRecord payload containing the computed contributions in dollars for employer and employee.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CobraRateRecord'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - oidc:
        - api.policiesFull
components:
  schemas:
    ProblemDetails:
      type: object
      additionalProperties: {}
      properties:
        type:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
    CobraRateStrategy:
      allOf:
      - $ref: '#/components/schemas/CobraRateStrategyInfo'
      - type: object
        description: A COBRA rate strategy record
        additionalProperties: false
        required:
        - id
        properties:
          id:
            type: integer
            description: The unique Zywave identifier for the COBRA Rate Strategy
            format: int32
            maximum: 2147483647.0
            minimum: 1.0
    CobraRateOption:
      type: string
      description: ''
      x-enumNames:
      - OneHundredPercent
      - OneHundredOnePercent
      - OneHundredTwoPercent
      enum:
      - OneHundredPercent
      - OneHundredOnePercent
      - OneHundredTwoPercent
    CobraRateStrategyInfo:
      type: object
      description: A COBRA strategy record
      additionalProperties: false
      properties:
        defaultRate:
          description: "The default COBRA rate (as a percentage) to apply to `CobraRateRecord` values for the policy.\n            \nThe default value for this property is `102`.\n            \nThis rate is used if `OverrideDefaultRate` is `false`; it is ignored if `true`.\n            \nIf `false`, the `DefaultRate` is multiplied by the policy rate for the rate tier."
          default: OneHundredTwoPercent
          oneOf:
          - $ref: '#/components/schemas/CobraRateOption'
        overrideDefaultRate:
          type:
          - boolean
          - 'null'
          description: "If `true`, then the default rate is overriden in the `CobraRateRecord` values for the policy.\n            \nThe default value for this property is `false`.\n            \n**Note:** Changing this value from `false` to `true` will **OVERWRITE** the saved values."
          default: false
    CobraRatesWithStrategy:
      type: object
      additionalProperties: false
      properties:
        strategy:
          description: The CobraRateStrategy.
          oneOf:
          - $ref: '#/components/schemas/CobraRateStrategy'
        cobraRates:
          type:
          - array
          - 'null'
          description: An array of CobraRateRecord values.
          items:
            $ref: '#/components/schemas/CobraRateRecord'
    CobraRateRecord:
      allOf:
      - $ref: '#/components/schemas/CobraRateRecordInfo'
      - type: object
        description: A COBRA rate record
        additionalProperties: false
        required:
        - id
        properties:
          id:
            type: integer
            description: The unique Zywave identifier for the COBRA Rate record
            format: int32
            maximum: 2147483647.0
            minimum: 1.0
          tier:
            description: The contribution tier for the rate record.
            oneOf:
            - $ref: '#/components/schemas/RateTierTypeOption'
    RateTierTypeOption:
      type: string
      description: ''
      x-enumNames:
      - Employee
      - EmployeeSpouse
      - EmployeeChildren
      - EmployeeFamily
      - EmployeeChild
      - EmployeeSpouseChild
      - EmployeeTwoChildren
      - EmployeeThreeChildren
      enum:
      - Employee
      - EmployeeSpouse
      - EmployeeChildren
      - EmployeeFamily
      - EmployeeChild
      - EmployeeSpouseChild
      - EmployeeTwoChildren
      - EmployeeThreeChildren
    CobraRateRecordInfo:
      type: object
      description: COBRA rate record info
      additionalProperties: false
      properties:
        cobraRate:
          type:
          - number
          - 'null'
          description: "The COBRA rate for the contribution tier.\n            \n**NOTE:** If the `CobraRateStrategy` associated with the policy has `OverrideDefaultRate` = `false`, this value will be calculated to follow the default rule."
          format: decimal
          maximum: 99999.99
          minimum: 0.0
          pattern: ^\d+\.?\d{0,2}$
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://auth.zywave.com/.well-known/openid-configuration
x-generator: NSwag v14.7.1.0 (NJsonSchema v11.6.1.0 (Newtonsoft.Json v13.0.0.0))
