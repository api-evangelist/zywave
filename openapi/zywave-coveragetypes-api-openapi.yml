paths:
  /policies/v2.0/coveragetypes/{id}:
    get:
      tags:
      - CoverageTypes
      summary: Returns the coverage type for the coverage type id specified
      description: 'Coverage types describe the type of coverages within an insurance category. Each coverage type drills down to more specific policy coverage types. Below shows an example of the insurance category, coverage type, and policy coverage type relationship.


        | InsuranceCategory | CoverageType | PolicyCoverageType |

        |-------------------|--------------------|--------------------|

        | Benefits | Dental | Dental |

        | Benefits | Worksite/Voluntary | Critical Illness |

        | Benefits | Worksite/Voluntary | Accident |

        | Benefits | Worksite/Voluntary | Pet Insurance |'
      operationId: CoverageTypes_GetCoverageType
      parameters:
      - name: id
        in: path
        required: true
        description: The coverage type id.
        schema:
          type: integer
          format: int32
        x-position: 1
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoverageType'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - oidc:
        - api.policies:read
