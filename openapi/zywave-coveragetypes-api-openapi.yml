    get:
      tags:
      - CoverageTypes
      summary: Returns list of coverage types
      description: 'Coverage types describe the type of coverages within an insurance category. Each coverage type drills down to more specific policy coverage types. Below shows an example of the insurance category, coverage type, and policy coverage type relationship.


        | InsuranceCategory | CoverageType | PolicyCoverageType |

        |-------------------|--------------------|--------------------|

        | Benefits | Dental | Dental |

        | Benefits | Worksite/Voluntary | Critical Illness |

        | Benefits | Worksite/Voluntary | Accident |

        | Benefits | Worksite/Voluntary | Pet Insurance |


        The Zywave API search is implemented using OData Version 4.0.1. Not all OData operations are available for the Zywave API platform at this time. Not all properties are filterable or sortable.

        The following properties can be used when filtering and ordering the response.

        * Id

        * Description

        * InsuranceCategory


        See the Zywave API search documentation for more details about using OData search.'
      operationId: CoverageTypes_SearchCoverageTypes
      parameters:
      - name: $filter
        x-originalName: filter
