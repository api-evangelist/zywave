          - 'null'
    DepartmentInfo:
      type: object
      additionalProperties: false
      required:
      - description
      properties:
        description:
          type: string
          description: The description of the department.
          maxLength: 50
          minLength: 1
        isArchived:
          type: boolean
          description: Indicates whether the department is archived.
    Department:
      allOf:
      - $ref: '#/components/schemas/DepartmentInfo'
      - type: object
        additionalProperties: false
        properties:
          id:
            type: integer
            description: The unique Zywave identifier for the department.
            format: int32
