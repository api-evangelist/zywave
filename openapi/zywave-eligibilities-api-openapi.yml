components:
  schemas:
    ProblemDetails:
      type: object
      additionalProperties: {}
      properties:
        type:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
    CoverageTerminationOption:
      type: string
      description: ''
      x-enumNames:
      - Immediate
      - LastDayOfMonth
      - ThirtyDaysAfter
      - FifteenthOfMonth
      enum:
      - Immediate
      - LastDayOfMonth
      - ThirtyDaysAfter
      - FifteenthOfMonth
    WaitingPeriodOption:
      type: string
      description: ''
      x-enumNames:
      - DateOfHire
      - NDaysAfterDateOfHire
      - NMonthsAfterDateOfHire
      - FirstOfMonthAfterDateOfHire
      - FirstOfMonthAfterNDaysAfterDateOfHire
      - FirstOfMonthAfterNMonthsAfterDateOfHire
      - FifteenthOfMonthAfterNDaysAfterDateOfHire
      - FifteenthOfMonthAfterNMonthsAfterDateOfHire
      enum:
      - DateOfHire
      - NDaysAfterDateOfHire
      - NMonthsAfterDateOfHire
      - FirstOfMonthAfterDateOfHire
      - FirstOfMonthAfterNDaysAfterDateOfHire
      - FirstOfMonthAfterNMonthsAfterDateOfHire
      - FifteenthOfMonthAfterNDaysAfterDateOfHire
      - FifteenthOfMonthAfterNMonthsAfterDateOfHire
    EligibilityInfo:
      type: object
      description: Eligibility information for a policy.
      additionalProperties: false
      properties:
        employeeGroup:
          description: 'The employee group or groups to which this eligibility information applies.


            This value can be a bit mask of EmployeeGroupOptions values. '
          oneOf:
          - $ref: '#/components/schemas/EmployeeGroupOptions'
        hours:
          type:
          - integer
          - 'null'
          description: The minimum weekly hours required for eligibility.
          format: int32
          maximum: 40.0
          minimum: 0.0
        waitingPeriod:
          description: The waiting period between hire date and first coverage.
          oneOf:
          - $ref: '#/components/schemas/WaitingPeriodOption'
        waitingPeriodAmount:
          type:
          - integer
          - 'null'
          description: The waiting period amount (days/months) used as needed with the WaitingPeriod.
          format: int32
          maximum: 365.0
          minimum: 0.0
        domesticPartnerCoverage:
          type:
          - boolean
          - 'null'
          description: Indicates if domestic partners are covered by the policy.
        coverageTermination:
          description: The coverage termination relative to employment termination.
          oneOf:
          - $ref: '#/components/schemas/CoverageTerminationOption'
        description:
          type:
          - string
          - 'null'
          description: The description of the eligibility coverage information.
          maxLength: 500
        spouseCoverage:
          type:
          - boolean
          - 'null'
          description: Indicates if spouse is covered by the policy.
        dependentCoverage:
          type:
          - boolean
          - 'null'
          description: Indicates if dependent or child is covered by the policy.
        otherCoverage:
          type:
          - boolean
          - 'null'
          description: Indicates if there is anything other covered by the policy.
        otherCoverageDescription:
          type:
          - string
          - 'null'
          description: The description of the other coverage information.
          maxLength: 100
    EmployeeGroupOptions:
      type: string
      description: ''
      x-enumFlags: true
      x-enumNames:
      - None
      - Salaried
      - NonSalaried
      - Management
      - Union
      - FullTime
      - All
      enum:
      - None
      - Salaried
      - NonSalaried
      - Management
      - Union
      - FullTime
      - All
    Eligibility:
      allOf:
      - $ref: '#/components/schemas/EligibilityInfo'
      - type: object
        description: The Eligibility for the policy.
        additionalProperties: false
        properties:
          id:
            type: integer
            description: The ID of the eligibility record.
            format: int32
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://auth.zywave.com/.well-known/openid-configuration
