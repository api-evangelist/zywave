  /licenses/v2.0/license/{licenseId}/feature:
    get:
      tags:
      - Feature
      summary: Search for features associated with a license
      description: 'The Zywave API search is implemented using OData Version 4.0.1.


        The following OData filter operations are supported by the Zywave API; each is accompanied by an example request.


        | Operation | Example Request | Returns |

        | ------- | -------- | -------- |

        | startswith | startswith(Name,''Zyw'') | Returns all features where the name starts with ''Zyw'' |

        | endswith | endswith(Name,''wave'') | Returns all features where the name ends with ''wave'' |

        | contains | contains(Name,''wave'') | Returns all features where the name contains ''wave'' |

        | Equals | Name eq ''Zywave'' | Returns all features named Zywave |

        | Not Equals | Name ne ''Zywave'' | Returns all features not named Zywave |

        | In | Name in (''Zyw'', ''ave'') | Returns all features with the names ''Zyw'' or ''ave''. |

        | Not | not startswith(Name,''Zyw'') | Returns all features with a name that doesn''t start with ‘Zyw’ |


        The Zywave API also supports the And operation which will allow for multiple search criteria to be applied to a single request. For example, the following filter will return all enabled features with a name containing "Zywave";


        *contains(Name,''Zywave'') and IsEnabled eq true*


        The orderby operation also supports multiple levels of ordering. For example, to order the results by name and description, the following can be used;


        *Name asc, Description asc*'
      operationId: Feature_SearchFeatures
      parameters:
      - name: licenseId
        in: path
        required: true
        description: The license id.
        schema:
          type: integer
          format: int32
        x-position: 1
      - name: $filter
        in: query
        description: The search criteria for the request. To view a list of supported search operations and the properties which can be searched see the documentation above.
        schema:
          type:
          - string
          - 'null'
        x-position: 2
      - name: $orderBy
        in: query
        description: Defines the order in which the results are returned. To view a list of properties that can be used in ordering see the documentation above.
        schema:
          type:
          - string
          - 'null'
        x-position: 3
      - name: $skip
        in: query
        description: The number of total records to skip before displaying the first result. For example, if there are 10 total records and $skip is set to 5 the first record shown in the response will be the 6th record returned. In order to avoid an error please ensure that the $skip is dividable by the $top.
        schema:
          type:
          - integer
          - 'null'
          format: int32
        x-position: 4
      - name: $top
        in: query
        description: The total number of records returned in the response. In order to avoid an error please ensure that the $skip is dividable by the $top.
        schema:
          type:
          - integer
          - 'null'
          format: int32
        x-position: 5
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedResultOfFeature'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '401':
          description: ''
          content:
            application/json:
              schema:
