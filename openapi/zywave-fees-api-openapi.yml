components:
  schemas:
    ProblemDetails:
      type: object
      additionalProperties: {}
      properties:
        type:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
    Fee:
      allOf:
      - $ref: '#/components/schemas/FeeInfo'
      - type: object
        description: A fee record
        additionalProperties: false
        required:
        - id
        properties:
          id:
            type: integer
            description: The unique Zywave identifier for the fee
            format: int32
            maximum: 2147483647.0
            minimum: 1.0
    FeeInfo:
      type: object
      description: Fee info
      additionalProperties: false
      required:
      - feeTypeId
      - frequency
      properties:
        amount:
          type:
          - number
          - 'null'
          description: The amount
          format: decimal
          maximum: 999999999.99
          minimum: 0.0
          pattern: ^\d+\.?\d{0,2}$
        count:
          type:
          - integer
          - 'null'
          description: The count
          format: int32
          maximum: 999999.0
          minimum: 0.0
        feeTypeId:
          type: integer
          description: The unique identifier of the FeeType
          format: int32
          maximum: 2147483647.0
          minimum: 1.0
        frequency:
          description: The FrequencyOption
          default: Annually
          oneOf:
          - $ref: '#/components/schemas/FrequencyOption'
        policyId:
          type:
