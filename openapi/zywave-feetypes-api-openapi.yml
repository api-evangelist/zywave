components:
  schemas:
    ProblemDetails:
      type: object
      additionalProperties: {}
      properties:
        type:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
    PagedResultOfFeeType:
      type: object
      additionalProperties: false
      properties:
        hasMoreResults:
          type: boolean
        pageIndex:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        skip:
          type: integer
          format: int32
        take:
          type: integer
          format: int32
        totalCount:
          type: integer
          format: int32
        items:
          type: array
          items:
            $ref: '#/components/schemas/FeeType'
    BaseFeeTypeOption:
      type: string
      description: ''
      x-enumNames:
      - Administrative
      - Agency
      - Vendor
      - Service
      - Billing
      - Other
      enum:
      - Administrative
      - Agency
      - Vendor
      - Service
      - Billing
      - Other
    FeeType:
      allOf:
      - $ref: '#/components/schemas/FeeTypeInfo'
      - type: object
        additionalProperties: false
        required:
        - id
        properties:
          id:
            type: integer
            format: int32
            maximum: 2147483647.0
            minimum: 1.0
    ValidationProblemDetails:
      allOf:
      - $ref: '#/components/schemas/HttpValidationProblemDetails'
      - type: object
        additionalProperties: {}
        properties:
          errors:
            type: object
            additionalProperties:
              type: array
              items:
                type: string
    HttpValidationProblemDetails:
      allOf:
      - $ref: '#/components/schemas/ProblemDetails'
      - type: object
        additionalProperties: {}
        properties:
          errors:
            type: object
            additionalProperties:
              type: array
              items:
                type: string
    FeeTypeInfo:
      type: object
      description: Fee type info
      additionalProperties: false
      required:
      - baseFeeType
      - description
      - isArchived
      - isDefault
      properties:
        baseFeeType:
          description: The BaseFeeTypeOption
          default: Administrative
          oneOf:
          - $ref: '#/components/schemas/BaseFeeTypeOption'
        description:
          type: string
          description: The fee description
          maxLength: 100
          minLength: 1
        isArchived:
          type: boolean
          description: If archived
          default: false
        isDefault:
          type: boolean
          description: If the fee type should appear in the default list
          default: false
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://auth.zywave.com/.well-known/openid-configuration
