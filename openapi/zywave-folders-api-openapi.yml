tags:
- name: Folders
paths:
  /bkb/v2.0/folder:
    get:
      tags:
      - Folders
      summary: Returns all active folders for an entity.
      operationId: Folder_GetFolders
      parameters:
      - name: entityId
        in: query
        description: Required positive integer; entity's unique identifier
        schema:
          type: integer
          format: int32
        x-position: 1
      - name: entityType
        in: query
        description: Required enum; Account, Carrier, or General
        schema:
          $ref: '#/components/schemas/EntityType'
        x-position: 2
      responses:
        '200':
          description: Returns the collection of folders.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Folder'
        '400':
          description: Bad Request - invalid entity type provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized - authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden - insufficient permissions to access folders.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not Found - entity does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        default:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    post:
      tags:
      - Folders
      summary: Creates a folder for an Account or Carrier entity.
      operationId: Folder_Create
      requestBody:
        x-name: request
        description: Body; entityId, entityType, name required; parentFolderId optional
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFolderRequest'
        x-position: 1
      responses:
        '201':
          description: Folder created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderResponse'
        '400':
          description: Bad Request - missing or invalid required field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized - authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden - insufficient scope; requires api.bkb.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not Found - feature flag disabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Conflict - idempotency key already used for an in-flight request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: ''
        '502':
          description: ''
        default:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /bkb/v2.0/folder/{folderIdentifier}:
    put:
      tags:
      - Folders
      summary: Renames a folder by its GUID using full replacement semantics.
      operationId: Folder_RenameFolder
      parameters:
      - name: folderIdentifier
        in: path
        required: true
        description: Folder GUID route param; identifies folder to rename.
        schema:
          type: string
          format: guid
        x-position: 1
      - name: entityType
        in: query
        description: 'Entity type: Account, Carrier, or General.'
        schema:
          $ref: '#/components/schemas/EntityType'
        x-position: 3
      - name: entityId
        in: query
        description: Entity integer ID owning this folder.
        schema:
          type: integer
          format: int32
        x-position: 4
      requestBody:
        x-name: request
        description: Body; name field required; 1-255 characters.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameFolderRequest'
        required: true
        x-position: 2
      responses:
        '200':
          description: Returns the renamed folder.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderResponse'
        '400':
          description: Bad Request - invalid input or folder name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized - authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden - insufficient permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not Found - folder does not exist or file management is disabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Conflict - folder name already in use.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        default:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    patch:
      tags:
      - Folders
      summary: Archives a folder via JSON Patch replace on /status with value archive.
      operationId: Folder_PatchFolder
      parameters:
