  /plans/v2.0/plan/{state}/plan:
    get:
      tags:
      - Plans
      summary: Searches for plans within a given state
      description: 'For more information on how to work with the Search endpoints within the Zywave API check out OData Search within the Zywave API documentation.


        The following properties can be used when filtering and ordering the response:


        | Search parameter | Use case |

        | ------- | -------- |

        | PlanType | (Medical/Dental/Vision) Used to filter by plantype |

        | StartDate | Used to filter by plan StartDate |

        | EndDate | Used to filter by plan EndDate |

        | CarrierCompanyId | Used to filter by CarrierCompanyId |'
      operationId: Plan_SearchPlans2
      parameters:
      - name: state
        in: path
        required: true
        schema:
          type: string
        x-position: 1
      - name: $filter
        x-originalName: filter
        in: query
        description: The filter used to find the desired plans
        schema:
          type:
          - string
          - 'null'
        x-position: 2
      - name: $orderBy
        x-originalName: orderBy
        in: query
        description: The properties used to order the search results
        schema:
          type:
          - string
          - 'null'
        x-position: 3
      - name: $skip
        x-originalName: skip
        in: query
        description: The number of records in the result set to skip
        schema:
          type:
          - string
          - 'null'
        x-position: 4
      - name: $top
        x-originalName: top
        in: query
        description: The maximum number of records after the first skip records to take from the remaining result set
        schema:
          type:
          - string
          - 'null'
        x-position: 5
      responses:
        '200':
          description: The plans that fulfill the search criteria on the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResultOfPlan'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails_2'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails_2'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails_2'
      security:
      - oidc:
        - api.plans
        - api.plans:read
    servers:
    - url: https://api.zywave.com
  /plans/v2.0/plan/{planId}/sbc:
    get:
      tags:
