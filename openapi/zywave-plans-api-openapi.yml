components:
  schemas:
    ValueSearchCriteriaOfInteger:
      allOf:
      - $ref: '#/components/schemas/SearchCriteriaBase'
      - type: object
        additionalProperties: false
        properties:
          rangeEndValue:
            type:
            - integer
            - 'null'
            format: int32
          rangeStartValue:
            type:
            - integer
            - 'null'
            format: int32
          searchType:
            $ref: '#/components/schemas/ValueSearchType'
          value:
            type:
            - integer
            - 'null'
            format: int32
    CommissionTypes:
      type: string
      description: CommissionTypes
      x-enumNames:
      - Annual
      - Schedule
      - EqualPayments
      - Rate
      - NoCommission
      enum:
      - Annual
      - Schedule
      - EqualPayments
      - Rate
      - NoCommission
    PayMode2:
      allOf:
      - $ref: '#/components/schemas/Lookup3'
      - type: object
        description: The timeline on which commissions are recorded for a plan.
        additionalProperties: false
        properties:
          paymentsPerYear:
            type: integer
            description: Gets or sets the number of payments per year.
            format: int32
    CustomField:
      type: object
      additionalProperties: false
      properties:
        brokerId:
          type: integer
          format: int32
        fieldType:
          $ref: '#/components/schemas/FieldType'
        id:
          type: integer
          format: int32
        includeOnRfp:
          type: boolean
        isDeleted:
          type: boolean
        isRequired:
          type: boolean
        lookups:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Lookup'
        name:
          type:
          - string
          - 'null'
        showInAmc:
          type: boolean
        showOnAccountHomePage:
          type: boolean
        sortOrder:
          type: integer
          format: int32
    FieldType:
      type: string
      description: ''
      x-enumNames:
      - Unknown
      - AlphaNumeric
      - Numeric
      - Date
      - DropDownList
      - YesNo
      - StatesProvinces
      - Email
      - Phone
      - Paragraph
      - Currency
      enum:
      - Unknown
      - AlphaNumeric
      - Numeric
      - Date
      - DropDownList
      - YesNo
      - StatesProvinces
      - Email
      - Phone
      - Paragraph
      - Currency
    ValueSearchCriteriaOfDecimal:
      allOf:
      - $ref: '#/components/schemas/SearchCriteriaBase'
      - type: object
        additionalProperties: false
        properties:
          rangeEndValue:
            type:
            - number
            - 'null'
            format: decimal
          rangeStartValue:
            type:
            - number
            - 'null'
            format: decimal
          searchType:
            $ref: '#/components/schemas/ValueSearchType'
          value:
            type:
            - number
            - 'null'
            format: decimal
    SearchCriteriaBase:
      type: object
      x-abstract: true
      additionalProperties: false
      properties:
        sort:
          $ref: '#/components/schemas/SortType'
        sortOrder:
          type: integer
          format: int32
    PlanSearchRequestModel:
      type: object
      additionalProperties: false
      properties:
        searchCriteria:
          oneOf:
          - $ref: '#/components/schemas/PlanSearchCriteria'
        searchOptions:
          oneOf:
          - $ref: '#/components/schemas/SearchOptions2'
    ValueSearchCriteriaOfDateTime:
      allOf:
      - $ref: '#/components/schemas/SearchCriteriaBase'
      - type: object
        additionalProperties: false
        properties:
          rangeEndValue:
            type:
            - string
            - 'null'
            format: date-time
          rangeStartValue:
            type:
            - string
            - 'null'
            format: date-time
          searchType:
            $ref: '#/components/schemas/ValueSearchType'
          value:
            type:
            - string
            - 'null'
            format: date-time
    StringSearchCriteria:
      allOf:
      - $ref: '#/components/schemas/SearchCriteriaBase'
      - type: object
        additionalProperties: false
        properties:
          searchType:
            $ref: '#/components/schemas/StringSearchType'
