    SearchOptions2:
      type: object
      additionalProperties: false
      properties:
        pageIndex:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
    BooleanSearchType:
      type: string
      description: ''
      x-enumNames:
      - None
      - Equals
      - NotEquals
      enum:
      - None
      - Equals
      - NotEquals
    EnumSearchType:
      type: string
      description: ''
      x-enumNames:
      - None
      - Equals
      - NotEquals
      - Contains
      enum:
      - None
      - Equals
      - NotEquals
      - Contains
    PagedResultOfPlan:
      type: object
      additionalProperties: false
      properties:
        hasMoreResults:
          type: boolean
        pageIndex:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        skip:
          type: integer
          format: int32
        take:
          type: integer
          format: int32
        totalCount:
          type: integer
          format: int32
        items:
          type: array
          items:
            $ref: '#/components/schemas/Plan'
    NullableEnumSearchCriteriaOfCommissionType:
      allOf:
      - $ref: '#/components/schemas/EnumSearchCriteriaOfCommissionType'
      - type: object
        additionalProperties: false
    StringSearchType:
      type: string
      description: ''
      x-enumNames:
      - None
      - Equals
      - NotEquals
      - Contains
      - IsNullOrEmpty
      - StartsWith
      - EndsWith
      enum:
      - None
      - Equals
      - NotEquals
      - Contains
      - IsNullOrEmpty
      - StartsWith
      - EndsWith
    IdListSearchType:
      type: string
      description: ''
      x-enumNames:
      - None
      - Equals
      - NotEquals
      - Contains
      enum:
      - None
      - Equals
      - NotEquals
      - Contains
    DateTimeSearchCriteria:
      allOf:
      - $ref: '#/components/schemas/ValueSearchCriteriaOfDateTime'
      - type: object
        additionalProperties: false
    PlanSearchCriteria:
      type: object
      description: Search criteria used to search for plans.
      additionalProperties: false
      properties:
        accountId:
          description: Gets or sets the account id.
          oneOf:
          - $ref: '#/components/schemas/IdListSearchCriteria'
        planCode:
          description: Gets or sets the ams plan code.
          oneOf:
          - $ref: '#/components/schemas/StringSearchCriteria'
        basePlanTypeId:
          description: Gets or sets the type of the base plan id.
          oneOf:
          - $ref: '#/components/schemas/IdListSearchCriteria'
        beginningPolicyStatusId:
          description: Gets or sets the beginning policy status id.
          oneOf:
          - $ref: '#/components/schemas/IdListSearchCriteria'
        billingCarrierId:
          description: Gets or sets the billing carrier id.
          oneOf:
          - $ref: '#/components/schemas/IntSearchCriteria'
        billingCarrierCodeId:
          description: Gets or sets the billing carrier code id.
          oneOf:
          - $ref: '#/components/schemas/IntSearchCriteria'
        billingModeId:
          description: Gets or sets the billing mode id.
          oneOf:
          - $ref: '#/components/schemas/IdListSearchCriteria'
        carrierPolicyNumber:
          description: Gets or sets the carrier policy number.
          oneOf:
          - $ref: '#/components/schemas/StringSearchCriteria'
        commissionProducerId:
          description: Gets or sets the commission producer id.
          oneOf:
          - $ref: '#/components/schemas/IntSearchCriteria'
        commissionRate:
          description: Gets or sets the commission rate.
          oneOf:
