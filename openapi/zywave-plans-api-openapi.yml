openapi: 3.2.0
info:
  title: Zywave Plans API
  version: v2.0
  description: 'Operations tagged Plans across 2 of this provider''s published API definitions: zywave-bkb-v2-openapi.json, zywave-plans-v2-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.zywave.com
tags:
- name: Plans
paths:
  /bkb/v2.0/plans/{planId}:
    get:
      tags:
      - Plans
      summary: Gets the account plan (planhistory) by id
      operationId: Plans_GetPlanById
      parameters:
      - name: planId
        in: path
        required: true
        description: The plan id.
        schema:
          type: integer
          format: int32
        x-position: 1
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - oidc:
        - api.bkb
        - api.bkb:read
    servers:
    - url: https://api.zywave.com
  /bkb/v2.0/plans/update/{planId}:
    put:
      tags:
      - Plans
      summary: Updates the plan with options
      operationId: Plans_UpdatePlanWithOptions
      parameters:
      - name: planId
        in: path
        required: true
        description: The plan id.
        schema:
          type: integer
          format: int32
        x-position: 1
      requestBody:
        x-name: updatePlanWithOptionsRequestModel
        description: The PlanWithOptionsRequestModel.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanWithOptionsRequestModel'
        required: true
        x-position: 2
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: ''
          content:
            application/json:
              schema:
