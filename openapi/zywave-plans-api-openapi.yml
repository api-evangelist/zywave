          oneOf:
          - $ref: '#/components/schemas/IdListSearchCriteria'
        commissionType:
          description: Gets or sets the type of the commission.
          oneOf:
          - $ref: '#/components/schemas/NullableEnumSearchCriteriaOfCommissionType'
        currentSubscribers:
          description: Gets or sets the current subscribers.
          oneOf:
          - $ref: '#/components/schemas/IntSearchCriteria'
        customerServiceRepId:
          description: Gets or sets the customer service rep id.
          oneOf:
          - $ref: '#/components/schemas/IntSearchCriteria'
        customFields:
          type:
          - array
          - 'null'
          description: 'Gets or sets the criteria used to search for plan by custom field.

            Maximum of 5 custom field searches allowed.'
          items:
            $ref: '#/components/schemas/CustomFieldSearchValue2'
        departmentId:
          description: Gets or sets the department id.
          oneOf:
          - $ref: '#/components/schemas/IdListSearchCriteria'
        endingPolicyStatusId:
          description: Gets or sets the ending policy status id.
          oneOf:
          - $ref: '#/components/schemas/IdListSearchCriteria'
        expectedCommission:
          description: Gets or sets the expected commission.
          oneOf:
          - $ref: '#/components/schemas/DecimalSearchCriteria'
        expectedPremium:
          description: Gets or sets the expected premium.
          oneOf:
          - $ref: '#/components/schemas/DecimalSearchCriteria'
        id:
          description: Gets or sets the id.
          oneOf:
          - $ref: '#/components/schemas/IdListSearchCriteria'
        issuingCarrierId:
          description: Gets or sets the issuing carrier id.
          oneOf:
          - $ref: '#/components/schemas/IntSearchCriteria'
        issuingCarrierCodeId:
          description: Gets or sets the issuing carrier code id.
          oneOf:
          - $ref: '#/components/schemas/IntSearchCriteria'
        payModeId:
          description: Gets or sets the pay mode id.
          oneOf:
          - $ref: '#/components/schemas/IdListSearchCriteria'
        planTypeId:
          description: Gets or sets the plan type id.
          oneOf:
          - $ref: '#/components/schemas/IdListSearchCriteria'
        planName:
          description: Gets or sets the name.
          oneOf:
          - $ref: '#/components/schemas/StringSearchCriteria'
        firstWrittenDate:
          description: Gets or sets the first written date.
          oneOf:
          - $ref: '#/components/schemas/DateTimeSearchCriteria'
        lastUpdatedDate:
