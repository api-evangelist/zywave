components:
  schemas:
    ProblemDetails:
      type: object
      additionalProperties: {}
      properties:
        type:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
    PagedResultOfPolicyCoverageType:
      type: object
      additionalProperties: false
      properties:
        hasMoreResults:
          type: boolean
        pageIndex:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        skip:
          type: integer
          format: int32
        take:
          type: integer
          format: int32
        totalCount:
          type: integer
          format: int32
        items:
          type: array
          items:
            $ref: '#/components/schemas/PolicyCoverageType'
    PolicyCoverageType:
      allOf:
      - $ref: '#/components/schemas/PolicyCoverageTypeInfo'
      - type: object
        additionalProperties: false
        properties:
          id:
            type: integer
            description: The unique Zywave identifier for the policy coverage type.
            format: int32
    PolicyCoverageTypeInfo:
      type: object
      additionalProperties: false
      required:
      - coverageTypeId
      - description
      properties:
        coverageTypeId:
          type: integer
          description: The unique Zywave identifier for the policy coverage type.  Has a dependency on a coverage type item.  Please use the coverage type endpoint for reference.
          format: int32
        description:
          type: string
          description: The description of the policy coverage type.
          maxLength: 50
          minLength: 1
        isArchived:
          type: boolean
          description: Indicates whether the policy coverage type is archived.
          default: false
        acordCode:
          type:
          - string
          - 'null'
          description: Gets or sets the value of the ACORD line of business code
          maxLength: 5
          minLength: 1
    ValidationProblemDetails:
      allOf:
      - $ref: '#/components/schemas/HttpValidationProblemDetails'
      - type: object
        additionalProperties: {}
        properties:
          errors:
            type: object
            additionalProperties:
              type: array
              items:
                type: string
    HttpValidationProblemDetails:
      allOf:
      - $ref: '#/components/schemas/ProblemDetails'
      - type: object
        additionalProperties: {}
        properties:
          errors:
            type: object
            additionalProperties:
              type: array
              items:
                type: string
