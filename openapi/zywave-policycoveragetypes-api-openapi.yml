paths:
  /policies/v2.0/policycoveragetypes/{id}:
    get:
      tags:
      - PolicyCoverageTypes
      summary: Returns the policy coverage type for the policy coverage type id specified
      description: 'Policy coverage type has a dependency on other policy items and caller should be able to handle discrepancies, race conditions, and object creation order. Please check model for more information on each dependency.

        Policy coverage types describe the type of coverage a policy provides. Each policy coverage type belongs to an even broader coverage type, and each coverage type belongs to an even broader insurance category. Below shows an example of the insurance category, coverage type, and policy coverage type relationship.


        | InsuranceCategory | CoverageType | PolicyCoverageType |

        |-------------------|--------------------|--------------------|

        | Benefits | Dental | Dental |

        | Benefits | Worksite/Voluntary | Critical Illness |

        | Benefits | Worksite/Voluntary | Accident |

        | Benefits | Worksite/Voluntary | Pet Insurance |'
      operationId: PolicyCoverageTypes_GetPolicyCoverageType
      parameters:
      - name: id
        in: path
        required: true
        description: The policy coverage group id.
        schema:
          type: integer
          format: int32
        x-position: 1
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyCoverageType'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - oidc:
        - api.policies:read
