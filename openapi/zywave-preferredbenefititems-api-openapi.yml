      security:
      - oidc:
        - api.policies:readFull
    put:
      tags:
      - PreferredBenefitItems
      summary: Sets or unsets a preferred benefit item for the agency
      description: 'Use this endpoint to mark a single benefit item as preferred or non-preferred for the agency.

        Setting IsPreferred to true creates or updates the preferred benefit item record.

        Setting IsPreferred to false removes the preferred benefit item record if it exists.'
      operationId: PreferredBenefitItems_SetPreferredBenefitItem
      requestBody:
        x-name: info
        description: The set preferred benefit item info.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPreferredBenefitItemInfo'
        required: true
        x-position: 1
      responses:
        '200':
          description: The updated benefit item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenefitItem'
        '400':
          description: ''
          content:
