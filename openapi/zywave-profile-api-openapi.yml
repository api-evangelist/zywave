              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/profiles/v2.1/profile/{typeCode}/{id}:
    get:
      tags:
      - Profile
      summary: Returns profile details for a single profile
      operationId: Profile_GetProfile
      parameters:
      - name: id
        in: path
        required: true
        description: The profile unique identifier.
        schema:
          type: string
        x-position: 1
      - name: typeCode
        in: path
        required: true
        description: The type of profile.
        schema:
          type: string
        x-position: 2
      responses:
        '200':
          description: Ok(Profile)
          content:
