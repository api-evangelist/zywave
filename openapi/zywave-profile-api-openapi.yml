              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  schemas:
    ProblemDetails:
      type: object
      additionalProperties: {}
      properties:
        type:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
    Permission:
      type: object
      additionalProperties: false
      properties:
        directive:
          description: Defines how the permission should be applied.
          oneOf:
          - $ref: '#/components/schemas/PermissionDirective'
        precedence:
          type: integer
          description: Indicates importance in case of conflict - the highest precedence value is used.
          format: int32
        resourcePath:
          type: string
          description: The path of the resource that the permission applies to.
        rights:
          type: integer
          description: A bit mask indicating what rights are applied.
          format: int32
    PermissionDirective:
      type: string
      description: ''
      x-enumNames:
      - Allow
      - Deny
      enum:
      - Allow
      - Deny
    Profile:
      type: object
      additionalProperties: false
      properties:
        claims:
          type: array
          description: Claim data associated with the profile.
          items:
            $ref: '#/components/schemas/ProfileClaim'
        emailAddress:
          type:
          - string
          - 'null'
          description: The email address associated with the profile.
        id:
          type: string
          description: The unique identifier for the profile.
        isActive:
          type: boolean
          description: Specifies whether the profile is active or inactive.
        profileName:
          type:
          - string
          - 'null'
          description: The name of the profile, as entered by the linked user.
        profileToken:
          type:
          - string
          - 'null'
          description: A contextual token for the profile. This can be used in subsequent API requests, as an alternative to inferring the active profile.
        typeCode:
          type: string
          description: The type of profile.
        userPrincipalId:
          type:
          - string
          - 'null'
          description: The unique identifier of the user linked to the profile.
          format: guid
    ValidationProblemDetails:
      allOf:
      - $ref: '#/components/schemas/HttpValidationProblemDetails'
      - type: object
        additionalProperties: {}
        properties:
          errors:
            type: object
            additionalProperties:
              type: array
              items:
                type: string
    HttpValidationProblemDetails:
      allOf:
      - $ref: '#/components/schemas/ProblemDetails'
      - type: object
        additionalProperties: {}
        properties:
          errors:
            type: object
            additionalProperties:
              type: array
              items:
                type: string
    ClaimValueType:
      type: string
      description: ''
      x-enumNames:
      - Invalid
      - Base64Binary
      - Boolean
      - Date
      - Datetime
      - DaytimeDuration
      - Double
      - DsaKeyValue
      - HexBinary
      - Integer
      - KeyInfo
      - Rfc822Name
      - RsaKeyValue
      - String
      - Time
      - X500Name
      - YearMonthDuration
      enum:
      - Invalid
      - Base64Binary
      - Boolean
      - Date
      - Datetime
      - DaytimeDuration
      - Double
      - DsaKeyValue
      - HexBinary
      - Integer
      - KeyInfo
      - Rfc822Name
      - RsaKeyValue
      - String
      - Time
      - X500Name
      - YearMonthDuration
    ProfileClaim:
      type: object
      additionalProperties: false
      required:
      - type
      - value
      properties:
        type:
          type: string
        value:
          type: string
        valueType:
          $ref: '#/components/schemas/ClaimValueType'
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://auth.zywave.com/.well-known/openid-configuration
