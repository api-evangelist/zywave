      summary: Searches for profiles
      operationId: Profile_SearchProfiles
      parameters:
      - name: typeCode
        in: path
        required: true
        schema:
          type: string
        x-position: 1
      - name: pageIndex
        in: query
        description: The search result page index.
        schema:
          type: integer
          default: 0
        x-position: 2
      - name: pageSize
        in: query
        description: The search result page size.
        schema:
