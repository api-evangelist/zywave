        schema:
          type: string
        x-position: 1
      responses:
        '204':
          description: Ok(Profile)
    get:
      tags:
      - Profile
      summary: Returns profile details for the user's active profile
      operationId: Profile_GetCurrentProfile
      parameters:
      - name: typeCode
        in: path
        required: true
        description: The type of profile.
        schema:
          type: string
        x-position: 1
      responses:
        '200':
          description: Ok(Profile)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    put:
      tags:
      - Profile
      summary: Sets the user's active profile
      operationId: Profile_SetCurrentProfile
      parameters:
      - name: typeCode
        in: path
        required: true
        description: The type of profile.
        schema:
          type: string
        x-position: 2
      - name: Profile
        x-originalName: profileContext
        in: header
        schema:
          type:
          - string
          - 'null'
        x-position: 3
      requestBody:
        x-name: id
        description: The profile unique identifier.
        content:
          application/json:
            schema:
              type: string
        required: true
        x-position: 1
      responses:
        '204':
          description: NoContent()
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/profiles/v2.1/profile/{typeCode}/current/permissions:
    get:
      tags:
