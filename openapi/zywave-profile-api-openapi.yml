      summary: Returns permission details for a single profile
      operationId: Profile_GetProfilePermissions
      parameters:
      - name: id
        in: path
        required: true
        description: The profile unique identifier.
        schema:
          type: string
        x-position: 1
      - name: typeCode
        in: path
        required: true
