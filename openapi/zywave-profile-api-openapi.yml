  /api/profiles/v2.1/profile/{typeCode}/unlinked:
    get:
      tags:
      - Profile
      summary: Searches for unlinked profiles matching the subject's email address
      operationId: Profile_SearchUnlinkedProfiles
      parameters:
      - name: typeCode
        in: path
        required: true
        schema:
          type: string
        x-position: 1
      - name: pageIndex
        in: query
        description: The search result page index.
        schema:
          type: integer
          default: 0
        x-position: 2
      - name: pageSize
        in: query
