openapi: 3.2.0
info:
  title: Plans Quotes API
  version: v2.0
servers:
- url: https://api.zywave.com
security:
- oidc:
  - api.plans
  - api.plans:read
tags:
- name: Quotes
paths:
  /plans/v2.0/quote/{quoteId}/plan/{planId}/benefititem:
    get:
      tags:
      - Quotes
      summary: Gets all benefit items associated with a plan
      operationId: BenefitItem_GetBenefitItems
      parameters:
      - name: quoteId
        in: path
        required: true
        description: The unique Zywave identifier for a quote.
        schema:
          type: integer
          format: int32
        x-position: 1
      - name: planId
        in: path
        required: true
        description: The unique Zywave identifier for a plan.
        schema:
          type: integer
          format: int32
        x-position: 2
      responses:
        '200':
          description: The benefit items for a specified plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenefitItemCollection'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /plans/v2.0/quote/{quoteId}/memberrate:
    get:
      tags:
      - Quotes
      summary: Gets member rates associated with a quote, per quoted plan
      description: 'For more information on how to work with the Search endpoints within the Zywave API check out OData Search within the Zywave API documentation.


        The following properties can be used when filtering and ordering the response:


        | Search parameter | Use case |

        | ------- | -------- |

        | quotedPlanId | Filter the member rates returned to a specific quotedPlanId(s) |'
      operationId: MemberRate_GetMemberRates
      parameters:
      - name: quoteId
        in: path
        required: true
        description: The unique Zywave identifier for a quote.
        schema:
          type: integer
          format: int32
        x-position: 1
      - name: $filter
        x-originalName: filter
        in: query
        description: The filter used to find the desired quoted plans
        schema:
          type:
          - string
          - 'null'
        x-position: 2
      - name: $orderBy
        x-originalName: orderBy
        in: query
        description: The properties used to order the search results
        schema:
          type:
          - string
          - 'null'
        x-position: 3
      - name: $skip
        x-originalName: skip
        in: query
        description: The number of records in the result set to skip
        schema:
          type:
          - integer
          - 'null'
          format: int32
        x-position: 4
      - name: $top
        x-originalName: top
        in: query
        description: The maximum number of records after the first skip records to take from the remaining result set
        schema:
          type:
          - integer
          - 'null'
          format: int32
        x-position: 5
      responses:
        '200':
          description: A paged collection of member rates, per quoted plan, for a specified quote.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResultOfQuotedPlanWithMemberRates'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /plans/v2.0/quote/{quoteId}/quotedplan/{quotedPlanId}/memberrate:
    get:
      tags:
      - Quotes
      summary: Gets the member rates associated with a quoted plan
      operationId: MemberRate_GetMemberRates2
      parameters:
      - name: quoteId
        in: path
        required: true
        description: The unique Zywave identifier for a quote.
        schema:
          type: integer
          format: int32
        x-position: 1
      - name: quotedPlanId
        in: path
        required: true
        description: The unique Zywave identifier for the quoted plan.This id is specific to the combination of a quote and plan and is different than the general planId.
        schema:
          type: integer
          format: int32
        x-position: 2
      responses:
        '200':
          description: The member rates for a specified quoted plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberRateCollection'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /plans/v2.0/quote/{quoteId}/plan/{planId}:
    get:
      tags:
      - Quotes
      summary: Gets a specific plan included in a quote
      operationId: Plan_GetPlan
      parameters:
      - name: quoteId
        in: path
        required: true
        description: The unique Zywave identifier for a quote.
        schema:
          type: integer
          format: int32
        x-position: 1
      - name: planId
        in: path
        required: true
        description: The unique Zywave identifier for a plan.
        schema:
          type: integer
          format: int32
        x-position: 2
      responses:
        '200':
          description: The desired plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /plans/v2.0/quote/{quoteId}/plan:
    get:
      tags:
      - Quotes
      summary: Searches for plans within a quote
      description: 'For more information on how to work with the Search endpoints within the Zywave API check out OData Search within the Zywave API documentation.


        The following properties can be used when filtering and ordering the response:


        | Search parameter | Use case |

        | ------- | -------- |'
      operationId: Plan_SearchPlans
      parameters:
      - name: quoteId
        in: path
        required: true
        schema:
          type: integer
          format: int32
        x-position: 1
      - name: $filter
        x-originalName: filter
        in: query
        description: The filter used to find the desired plans
        schema:
          type:
          - string
          - 'null'
        x-position: 2
      - name: $orderBy
        x-originalName: orderBy
        in: query
        description: The properties used to order the search results
        schema:
          type:
          - string
          - 'null'
        x-position: 3
      - name: $skip
        x-originalName: skip
        in: query
        description: The number of records in the result set to skip
        schema:
          type:
          - string
          - 'null'
        x-position: 4
      - name: $top
        x-originalName: top
        in: query
        description: The maximum number of records after the first skip records to take from the remaining result set
        schema:
          type:
          - string
          - 'null'
        x-position: 5
      responses:
        '200':
          description: The plans that fulfill the search criteria on the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResultOfPlan'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /plans/v2.0/quote/{quoteId}/planrate:
    get:
      tags:
      - Quotes
      summary: Gets rates associated with a quote, per plan
      description: 'An age rate is a plan specific premium for an enrolled member based on their age. The rate will apply to all enrolled members who are the given age at the effective date of the plan. For this response, the tier will represent the age the premium is associated with. Anything 14 and under is considered the same rate and anything 65 and above is considered the same rate.

        A composite rate is a plan rate for a specific family tier. The rate will apply to all employees that fall into the specific family tier based on the family members that enroll in the plan. For this response, the tier will represent the coverage tier the premium is associated with. Values for the supported four coverage tier rate structure include; Employee, Employee + Spouse, Employee + Child, and Family.

        A level funded rate will return tiers similar to a composite rate, but may also include a breakdown of the different components that make up the rate.'
      operationId: PlanRate_GetPlanRates
      parameters:
      - name: quoteId
        in: path
        required: true
        description: The unique Zywave identifier for a quote.
        schema:
          type: integer
          format: int32
        x-position: 1
      - name: $filter
        x-originalName: filter
        in: query
        description: The filter used to find the desired quoted plans
        schema:
          type:
          - string
          - 'null'
        x-position: 2
      - name: $orderBy
        x-originalName: orderBy
        in: query
        description: The properties used to order the search results
        schema:
          type:
          - string
          - 'null'
        x-position: 3
      - name: $skip
        x-originalName: skip
        in: query
        description: The number of records in the result set to skip
        schema:
          type:
          - integer
          - 'null'
          format: int32
        x-position: 4
      - name: $top
        x-originalName: top
        in: query
        description: The maximum number of records after the first skip records to take from the remaining result set
        schema:
          type:
          - integer
          - 'null'
          format: int32
        x-position: 5
      responses:
        '200':
          description: A paged collection of rates, per plan, for a specified quote.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResultOfPlanWithRates'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /plans/v2.0/quote/{quoteId}/plan/{planId}/planrate:
    get:
      tags:
