          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
  /plans/v2.0/quote/{quoteId}/errors:
    get:
      tags:
      - Quotes
      summary: Gets errors for a specific quote
      operationId: Quote_GetQuoteErrors
      parameters:
      - name: quoteId
