  /plans/v2.0/quote/{quoteId}/plan/{planId}/sbc:
    get:
      tags:
      - Quotes
      summary: Gets the SBC for a quoted plan
      operationId: Sbc_GetSbc
      parameters:
      - name: quoteId
        in: path
        required: true
        description: The unique Zywave identifier for a quote.
        schema:
          type: integer
          format: int32
        x-position: 1
      - name: planId
        in: path
        required: true
        description: The unique Zywave identifier for a plan.
        schema:
          type: integer
          format: int32
        x-position: 2
      responses:
        '200':
          description: The SBC for the plan.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '502':
          description: ''
components:
  schemas:
    MemberRate:
      allOf:
      - $ref: '#/components/schemas/MemberRateInfo'
      - type: object
        additionalProperties: false
        properties:
          id:
            type: integer
            description: The unique Zywave identifier for the member rate.
            format: int32
            deprecated: true
    PlanRate:
      allOf:
      - $ref: '#/components/schemas/PlanRateInfo'
      - type: object
        additionalProperties: false
        properties:
          id:
            type: integer
            description: The unique Zywave identifier for the rate.
            format: int32
            deprecated: true
          updatedDateTime:
            type:
            - string
            - 'null'
            description: The date in which the rate was last updated.
            format: date-time
            deprecated: true
    PremiumType:
      type: string
      description: ''
      x-enumNames:
      - AgeBanded
      - Composite
      enum:
      - AgeBanded
      - Composite
    CoverageGroupQuotedPlan:
      allOf:
      - $ref: '#/components/schemas/CoverageGroupQuotedPlanInfo'
      - type: object
        additionalProperties: false
