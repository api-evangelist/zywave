        in: query
        description: The filter used to find the desired quoted plans
        schema:
          type:
          - string
          - 'null'
        x-position: 2
      - name: $orderBy
        x-originalName: orderBy
        in: query
        description: The properties used to order the search results
        schema:
          type:
          - string
          - 'null'
        x-position: 3
      - name: $skip
        x-originalName: skip
        in: query
        description: The number of records in the result set to skip
        schema:
          type:
          - integer
          - 'null'
          format: int32
        x-position: 4
      - name: $top
        x-originalName: top
        in: query
        description: The maximum number of records after the first skip records to take from the remaining result set
        schema:
          type:
          - integer
          - 'null'
          format: int32
        x-position: 5
      responses:
        '200':
          description: The quoted plans that fulfill the search criteria on the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResultOfCoverageGroupQuotedPlan'
        '400':
