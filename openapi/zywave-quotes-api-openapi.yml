                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /plans/v2.0/quote/{quoteId}:
    get:
      tags:
      - Quotes
      summary: Gets a specific quote
      operationId: Quote_GetQuote
      parameters:
      - name: quoteId
        in: path
        required: true
        description: The unique Zywave identifier for a quote.
        schema:
          type: integer
          format: int32
        x-position: 1
      responses:
        '200':
          description: The desired quote.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /plans/v2.0/quote/{quoteId}/marksold:
    post:
      tags:
      - Quotes
      summary: Marks a quote as sold, along with a list of plans
      operationId: Quote_MarkSold
      parameters:
      - name: quoteId
        in: path
        required: true
        description: The unique Zywave identifier for a quote.
        schema:
          type: integer
          format: int32
        x-position: 1
      requestBody:
        x-name: markSoldRequest
        description: A list of quoted plans to mark as sold and their premium type selections.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkSoldRequest'
        required: true
        x-position: 2
      responses:
        '200':
          description: ''
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /plans/v2.0/quote:
    get:
      tags:
      - Quotes
      summary: Searches for quotes
      description: 'For more information on how to work with the Search endpoints within the Zywave API check out OData Search within the Zywave API documentation.


        The following properties can be used when filtering and ordering the response:


        | Search parameter | Use case |

        | ------- | -------- |

        | accountId | Retrieve quotes related to an account in Zywave. |

        | effectiveDate | Retrieve quotes based on the effective data of the plans within the quote. |

        | updateDateTime | Retrieve all quotes based on when the quote was last updated. |

        | status | Retrieve all quotes with a specific quote status. This field can be used to only return quotes that have been marked sold/final. |

        | isArchived | Filter the quotes returned based on whether the quote is archived. |

        | state | Retrieve all quotes for a specific state. |'
      operationId: Quote_SearchQuotes
      parameters:
      - name: $filter
        x-originalName: filter
        in: query
        description: The filter used to find the desired quotes
        schema:
          type:
          - string
          - 'null'
        x-position: 1
      - name: $orderBy
        x-originalName: orderBy
        in: query
        description: The properties used to order the search results
        schema:
          type:
          - string
          - 'null'
        x-position: 2
      - name: $skip
        x-originalName: skip
        in: query
        description: The number of records in the result set to skip
        schema:
          type:
          - integer
          - 'null'
          format: int32
        x-position: 3
      - name: $top
        x-originalName: top
        in: query
        description: The maximum number of records after the first skip records to take from the remaining result set
        schema:
          type:
          - integer
          - 'null'
          format: int32
        x-position: 4
      responses:
        '200':
          description: The quotes that fulfill the search criteria on the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResultOfQuote'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    post:
      tags:
      - Quotes
      summary: Creates a quote
      description: Creates a quote and asynchronously finds and rates plans the group is eligible for. Progress can be monitored using the Status field.
      operationId: Quote_PostQuote
      requestBody:
        x-name: quoteInfo
        description: The quote to create.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteInfo'
        required: true
        x-position: 1
      responses:
        '201':
          description: A 201 Created response containing the ID of the created quote.
          content:
            application/json:
              schema:
                type: integer
                format: int32
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
  /plans/v2.0/quote/refreshquote:
    post:
      tags:
      - Quotes
      summary: Refreshes a quote
      description: Updates an existing quote with newly available plans or rates. Progress can be monitored using the Status field.
      operationId: Quote_RefreshQuote
      requestBody:
        x-name: refreshQuoteRequest
        description: The information about the quote to update.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshQuoteRequest'
        required: true
        x-position: 1
      responses:
        '201':
          description: A 201 Created response containing the ID of the updated quote.
          content:
            application/json:
              schema:
                type: integer
                format: int32
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '400':
