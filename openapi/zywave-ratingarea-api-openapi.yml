      summary: Searches for rating areas
      description: 'For more information on how to work with the Search endpoints within the Zywave API check out OData Search within the Zywave API documentation.


        The following properties can be used when filtering and ordering the response:


        | Search parameter | Use case |

        | ------- | -------- |

        | cmsRatingAreaId | Retrieve rating areas related to a CMS rating area ID. |

        | county | Retrieve rating areas related to a county. |

        | subdivisionCode | Retrieve rating areas related to a subdivision code. |

        | postalCode | Retrieve rating areas related to a postal code. |'
      operationId: RatingArea_SearchRatingAreas
      parameters:
      - name: $filter
        x-originalName: filter
        in: query
        description: The filter used to find the desired rating areas
        schema:
          type:
          - string
          - 'null'
        x-position: 1
      - name: $orderBy
        x-originalName: orderBy
        in: query
        description: The properties used to order the search results
        schema:
          type:
          - string
          - 'null'
        x-position: 2
      - name: $skip
        x-originalName: skip
        in: query
        description: The number of records in the result set to skip
        schema:
          type:
          - integer
          - 'null'
          format: int32
        x-position: 3
      - name: $top
        x-originalName: top
        in: query
        description: The maximum number of records after the first skip records to take from the remaining result set
        schema:
          type:
          - integer
          - 'null'
          format: int32
        x-position: 4
      responses:
        '200':
          description: The rating areas that fulfill the search criteria on the request.
          content:
