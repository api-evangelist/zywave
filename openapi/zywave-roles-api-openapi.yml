        title:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
        extensions:
          type: object
          additionalProperties: {}
    UserRole:
      type: object
      description: Represents a role a user may have on an account.
      additionalProperties: false
      properties:
        id:
          type: integer
          description: Gets or sets the unique ID for this role.
          format: int32
        brokerId:
          type: integer
          description: Gets or sets the unique broker ID for this role.
          format: int32
        name:
          type: string
          description: Gets or sets the role name.
    AssignedRole:
      type: object
      description: Represents the role an agency user has on an account.
      additionalProperties: false
      properties:
        accountId:
