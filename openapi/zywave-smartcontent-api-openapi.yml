openapi: 3.2.0
info:
  title: Smart Content API
  version: v2.0
servers:
- url: https://api.zywave.com
security:
- oidc:
  - api.content
  - api.content:read
tags:
- name: SmartContent
paths:
  /content/v2.0/smartcontent:
    get:
      tags:
      - SmartContent
      summary: Searches company recommended content
      operationId: SmartContent_GetSmartContent
      parameters:
      - name: lineOfBusiness
        in: query
        description: Filter smart content by line of business
        schema:
          $ref: '#/components/schemas/LineOfBusiness'
        x-position: 1
      - name: naicsCode
        in: query
        description: Filter smart content by six-digit NAICSCode
        schema:
          type:
          - integer
          - 'null'
          format: int32
        x-position: 2
      - name: clientSize
        in: query
        description: Filter smartcontent by client/employer size
        schema:
          oneOf:
          - $ref: '#/components/schemas/ClientSize'
        x-position: 3
      - name: usLocation
        in: query
        description: Fiter smart content by a location in the United States
        schema:
          oneOf:
          - oneOf:
            - $ref: '#/components/schemas/USLocation'
        x-position: 4
      - name: industryName
        in: query
        description: Filter smart content by industry name.
        schema:
          type:
          - string
          - 'null'
        x-position: 5
      responses:
        '200':
          description: Returns a list of aggregated content.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContentAggregation'
        '400':
          description: ''
          content:
            application/json:
              schema:
                type: string
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  schemas:
    ProblemDetails:
      type: object
      additionalProperties: {}
      properties:
        type:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
    Content:
      allOf:
      - $ref: '#/components/schemas/ContentInfo'
      - type: object
        description: A piece of content represents a container for files and metadata in the Zywave system. Can be maintained by an agency or Zywave.
        additionalProperties: false
        properties:
          id:
            type: integer
            description: The unique Zywave identifier for the content.
            format: int32
          fileId:
            type: integer
            description: The unique identifier for the lastest ContentFile for the content.
            format: int32
          fileName:
            type:
            - string
            - 'null'
            description: The name of the lastest ContentFile for the content.
          thumbnailUrl:
            type:
            - string
            - 'null'
            description: Thumbnail image source for the content.
          tagNames:
            type:
            - array
            - 'null'
            description: A list of tags that describes what the content is.
            items:
              type: string
    ClientSize:
      type: integer
      description: "0: Invalid,\n1: From0To25,\n2: From26To50,\n3: From51To99,\n4: From100To499,\n5: From500To999,\n6: From1000To2499,\n7: From2500To4999,\n9: MoreThan4999\n "
      x-enumNames:
      - Invalid
      - From0To25
      - From26To50
      - From51To99
      - From100To499
      - From500To999
      - From1000To2499
      - From2500To4999
      - MoreThan4999
      enum:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      - 8
    ContentInfo:
      type: object
      description: ContentInfo represents the editable properties of a piece of content.
      additionalProperties: false
      properties:
        title:
          type:
          - string
          - 'null'
          description: The title of the piece of content.
        description:
          type:
          - string
          - 'null'
          description: The description of the piece of content.
        clientDescription:
          type:
          - string
          - 'null'
          description: The description clients see for the piece of content.
        isActive:
          type: boolean
          description: Whether the content is active
        file:
          type:
          - string
          - 'null'
          description: The file that will be associated to the content.
          format: binary
        createdDateTime:
          type:
          - string
          - 'null'
          description: The date the content was created
          format: date-time
        updatedDateTime:
          type:
          - string
          - 'null'
          description: The date the file was last edited
          format: date-time
        metadata:
          type:
          - array
          - 'null'
          description: Additional dynamic information about the content.
          items:
            $ref: '#/components/schemas/KeyValuePairOfStringAndString'
    ContentAggregation:
      type: object
      description: A group of content with various metadatas
      additionalProperties: false
      properties:
        name:
          type:
          - string
          - 'null'
          description: The name of the aggregation
        category:
          type:
          - string
          - 'null'
          description: Category of the aggregation
        value:
          type:
          - string
          - 'null'
          description: Aggregation value, refers to how the content was aggregated
        sortOrder:
          type: integer
          description: Where the aggregation is sorted, 0 = first
          format: int32
        contentLookup:
          type:
          - array
          - 'null'
          description: A lookup of content ids and the smart content algorithm scores tied to those
          items:
            type: integer
            format: int32
        content:
          type:
          - array
          - 'null'
          description: The list of content tied to this aggregation
          items:
            $ref: '#/components/schemas/Content'
    KeyValuePairOfStringAndString:
      type: object
      additionalProperties: false
      properties:
        key:
          type:
          - string
          - 'null'
        value:
          type:
          - string
          - 'null'
