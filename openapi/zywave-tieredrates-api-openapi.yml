components:
  schemas:
    ProblemDetails:
      type: object
      additionalProperties: {}
      properties:
        type:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
    TieredRateInfo:
      allOf:
      - $ref: '#/components/schemas/TieredRateBaseInfo'
      - type: object
        description: Tiered rate info
        additionalProperties: false
        required:
        - policyId
        properties:
          policyId:
            type: integer
            description: The identifier for the policy that is tied to the tiered rate record. Has a dependency on a policy item.  Please use the policy endpoint for reference.
            format: int32
            maximum: 2147483647.0
            minimum: 1.0
    HttpValidationProblemDetails:
      allOf:
      - $ref: '#/components/schemas/ProblemDetails'
      - type: object
        additionalProperties: {}
        properties:
          errors:
            type: object
            additionalProperties:
              type: array
              items:
                type: string
    TieredRateBaseInfo:
      type: object
      additionalProperties: false
      required:
      - rateTierType
      properties:
        rateTierType:
          description: 'The identifier for the tier type that is tied to the tiered rate record. '
          oneOf:
          - $ref: '#/components/schemas/RateTierTypeOption'
        memberCount:
          type:
          - integer
          - 'null'
          description: The number of people included in the tiered rate.
          format: int32
          maximum: 2147483647.0
          minimum: 0.0
        monthlyRate:
          type:
          - number
          - 'null'
          description: The monthly rate for the tiered rate.
          format: decimal
          maximum: 99999.99
          minimum: 0.0
          pattern: ^\d+\.?\d{0,2}$
    ValidationProblemDetails:
      allOf:
      - $ref: '#/components/schemas/HttpValidationProblemDetails'
      - type: object
        additionalProperties: {}
        properties:
          errors:
            type: object
            additionalProperties:
              type: array
              items:
                type: string
    RateTierTypeOption:
      type: string
      description: ''
      x-enumNames:
      - Employee
      - EmployeeSpouse
      - EmployeeChildren
      - EmployeeFamily
      - EmployeeChild
      - EmployeeSpouseChild
      - EmployeeTwoChildren
      - EmployeeThreeChildren
      enum:
      - Employee
      - EmployeeSpouse
      - EmployeeChildren
      - EmployeeFamily
      - EmployeeChild
      - EmployeeSpouseChild
      - EmployeeTwoChildren
      - EmployeeThreeChildren
    TieredRate:
      allOf:
      - $ref: '#/components/schemas/TieredRateInfo'
      - type: object
        description: Represents a tiered rate
        additionalProperties: false
        properties:
          id:
            type: integer
            description: The unique Zywave identifier for the tiered rate.
            format: int32
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://auth.zywave.com/.well-known/openid-configuration
