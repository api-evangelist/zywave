        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - oidc:
        - api.policies:read
    put:
      tags:
      - Vendors
      summary: Updates the vendor custom name for the vendor id specified
      operationId: Vendors_PutVendorName
      parameters:
      - name: id
        in: path
        required: true
        description: The id of the vendor to update.
        schema:
          type: integer
          format: int32
        x-position: 1
      requestBody:
        x-name: vendorNameInfo
        description: The vendor custom name information to update.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorNameInfo'
        required: true
        x-position: 2
      responses:
        '204':
          description: A 204 No Content response.
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - oidc:
        - api.policies
  /policies/v2.0/vendors/custom:
    post:
      tags:
      - Vendors
      summary: Creates a custom vendor with the specified custom name
      description: The source identity fields (source id, source type, and source entity name) are assigned by the service and must not be supplied.
      operationId: Vendors_PostCustomVendor
      requestBody:
        x-name: vendorNameInfo
        description: The vendor custom name info to create.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorNameInfo'
        required: true
        x-position: 1
      responses:
        '201':
          description: A 201 Created response containing the id of the created vendor.
          content:
            application/json:
              schema:
                type: integer
                format: int32
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - oidc:
        - api.policies
components:
  schemas:
    VendorNameInfo:
      type: object
      description: Vendor name info
      additionalProperties: false
      required:
      - customName
      properties:
        customName:
          type: string
          description: The custom vendor name
          maxLength: 255
          minLength: 1
    ProblemDetails:
      type: object
      additionalProperties: {}
      properties:
        type:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
    Vendor:
      allOf:
      - $ref: '#/components/schemas/VendorInfo'
      - type: object
        description: A vendor record
        additionalProperties: false
        required:
        - id
        properties:
          id:
            type: integer
            description: The unique Zywave identifier for the vendor
            format: int32
            maximum: 2147483647.0
            minimum: 1.0
          customName:
            type:
            - string
            - 'null'
            description: The vendor name
            maxLength: 255
    VendorName:
      allOf:
      - $ref: '#/components/schemas/VendorNameInfo'
      - type: object
        description: A vendor name record
        additionalProperties: false
        required:
        - vendorId
        properties:
          vendorId:
            type: integer
            description: The unique Zywave identifier for the vendor
            format: int32
            maximum: 2147483647.0
            minimum: 1.0
    ValidationProblemDetails:
      allOf:
      - $ref: '#/components/schemas/HttpValidationProblemDetails'
      - type: object
        additionalProperties: {}
        properties:
          errors:
            type: object
            additionalProperties:
              type: array
              items:
                type: string
    VendorInfo:
      type: object
      description: Vendor info
      additionalProperties: false
      required:
      - sourceId
      - sourceType
      - sourceEntityName
      properties:
        sourceId:
          type: string
          description: Id of vendor in source
          maxLength: 36
          minLength: 1
        sourceType:
          type: string
          description: Type of source
          maxLength: 32
          minLength: 1
        sourceEntityName:
          type: string
          description: Entity name in source
          maxLength: 32
          minLength: 1
    HttpValidationProblemDetails:
      allOf:
      - $ref: '#/components/schemas/ProblemDetails'
      - type: object
        additionalProperties: {}
        properties:
          errors:
            type: object
            additionalProperties:
              type: array
              items:
                type: string
    PagedResultOfVendor:
      type: object
      additionalProperties: false
      properties:
        hasMoreResults:
          type: boolean
        pageIndex:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        skip:
          type: integer
          format: int32
        take:
          type: integer
          format: int32
        totalCount:
          type: integer
          format: int32
        items:
          type: array
          items:
            $ref: '#/components/schemas/Vendor'
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://auth.zywave.com/.well-known/openid-configuration
