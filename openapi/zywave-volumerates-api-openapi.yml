components:
  schemas:
    ProblemDetails:
      type: object
      additionalProperties: {}
      properties:
        type:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
    VolumeRateInfo:
      type: object
      description: Volume rate create/update data
      additionalProperties: false
      required:
      - monthlyRatePerBasisAmount
      - basisAmount
      - coverageOrSalaryAmount
      - amountType
      - description
      properties:
        monthlyRatePerBasisAmount:
          type: number
          description: The rate per BasisAmount
          format: decimal
          maximum: 99999.9999
          minimum: 0.0
          pattern: ^\d+\.?\d{0,4}$
        basisAmount:
          type: number
          description: The basis amount used when applying the MonthlyRatePerBasisAmount
          format: decimal
          maximum: 99999.99
          minimum: 0.0
          pattern: ^\d+\.?\d{0,2}$
        coverageOrSalaryAmount:
          type: number
          description: The total amount of coverage (can also be interpreted as salary when that is used to determine volume coverage).
          format: decimal
          maximum: 99999999999.99
          minimum: 0.0
          pattern: ^\d+\.?\d{0,2}$
        amountType:
          description: Indicates whether the BasisAmount represents Salary or Coverage.
          oneOf:
          - $ref: '#/components/schemas/VolumeAmountTypeOption'
        description:
          type: string
          description: The description for this record. This should be unique with respect to other VolumeRate records for the policy.
          maxLength: 255
          minLength: 1
        totalMonthlyPremium:
          type: number
          readOnly: true
          description: The calculated total monthly premium for this Volume Rate record. Fractional cents are rounded up.
          format: decimal
        totalAnnualPremium:
          type: number
          readOnly: true
          description: The calculated total annual premium for this Volume Rate record.
          format: decimal
    VolumeRate:
      allOf:
      - $ref: '#/components/schemas/VolumeRateInfo'
      - type: object
        description: Volume Rate data
        additionalProperties: false
        properties:
          id:
            type: integer
            description: The record id.
            format: int32
            maximum: 2147483647.0
            minimum: 1.0
    VolumeAmountTypeOption:
      type: string
      description: ''
      x-enumNames:
      - Salary
      - Coverage
      enum:
      - Salary
      - Coverage
    VolumeRates:
      type: object
      description: An array of volume rates with the total premium for all.
      additionalProperties: false
      properties:
        items:
          type:
          - array
          - 'null'
          description: An array of VolumeRate
          items:
            $ref: '#/components/schemas/VolumeRate'
        totalMonthlyPremium:
          type: number
          readOnly: true
          description: The total monthly premium for all Items.
          format: decimal
        totalAnnualPremium:
          type: number
          readOnly: true
          description: The total annual premium for all Items.
          format: decimal
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://auth.zywave.com/.well-known/openid-configuration
